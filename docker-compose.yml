version: '3.8'

services:
  # 1. Primary Relational Database (MySQL 8)
  mysql-db:
    image: mysql:8.0
    container_name: lifelink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_NAME:-lifelink_db}
      MYSQL_USER: ${DB_USER:-lifelink_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lifelink_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/db/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifelink-net

  # 2. Node.js Express & Socket.IO Backend API Engine
  lifelink-api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: lifelink-api
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-lifelink_user}
      DB_PASSWORD: ${DB_PASSWORD:-lifelink_pass_2026}
      DB_NAME: ${DB_NAME:-lifelink_db}
      JWT_SECRET: ${JWT_SECRET:-lifelink_super_secure_jwt_secret_key_2026_healthcare_node_production}
      JWT_EXPIRES_IN: 24h
      CLIENT_ORIGIN: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - lifelink-net

  # 3. Production React Single Page Application with NGINX Reverse Proxy
  lifelink-web:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: lifelink-web
    restart: unless-stopped
    depends_on:
      - lifelink-api
    ports:
      - "80:80"
    networks:
      - lifelink-net

volumes:
  mysql_data:
    driver: local

networks:
  lifelink-net:
    driver: bridge
